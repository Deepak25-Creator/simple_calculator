```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f2f2f2;
        }

        .calculator {
            width: 320px;
            padding: 20px;
            background: #222;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: #fff;
            text-align: right;
            font-size: 32px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            border: none;
            border-radius: 10px;
            font-size: 20px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        button:hover {
            background: #555;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #e68600;
        }

        .clear {
            background: #d9534f;
        }

        .delete {
            background: #777;
        }

        .equals {
            background: #28a745;
        }

        .zero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" class="display" id="display" value="0" readonly>

        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">AC</button>
            <button class="delete" onclick="deleteNumber()">DEL</button>
            <button class="operator" onclick="addOperator('%')">%</button>
            <button class="operator" onclick="addOperator('/')">÷</button>

            <button onclick="addNumber('7')">7</button>
            <button onclick="addNumber('8')">8</button>
            <button onclick="addNumber('9')">9</button>
            <button class="operator" onclick="addOperator('*')">×</button>

            <button onclick="addNumber('4')">4</button>
            <button onclick="addNumber('5')">5</button>
            <button onclick="addNumber('6')">6</button>
            <button class="operator" onclick="addOperator('-')">−</button>

            <button onclick="addNumber('1')">1</button>
            <button onclick="addNumber('2')">2</button>
            <button onclick="addNumber('3')">3</button>
            <button class="operator" onclick="addOperator('+')">+</button>

            <button class="zero" onclick="addNumber('0')">0</button>
            <button onclick="addNumber('.')">.</button>
            <button class="equals" onclick="calculate()">=</button>
        </div>

    </div>

    <script>
        const display = document.getElementById("display");

        function addNumber(number) {
            if (display.value === "0" && number !== ".") {
                display.value = number;
            } else {
                display.value += number;
            }
        }

        function addOperator(operator) {
            const lastChar = display.value.slice(-1);

            if ("+-*/%".includes(lastChar)) {
                return;
            }

            display.value += operator;
        }

        function clearDisplay() {
            display.value = "0";
        }

        function deleteNumber() {
            if (display.value.length === 1) {
                display.value = "0";
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        function calculate() {
            try {
                display.value = Function(
                    "return " + display.value
                )();
            } catch {
                display.value = "Error";
            }
        }
    </script>

</body>
</html>
